<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commonplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2b44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commonplace">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f3f6; --sheet:#ffffff; --ink:#16212e; --muted:#667385; --rule:#dde2ea; --soft:#e7ebf1;
  --navy:#1b2b44; --navy-ink:#ffffff; --sun:#f2b632; --danger:#b3261e;
  --sup:#2f8f6b; --chal:#c8452f; --read:#c98d0b; --ctx:#3b6fb6;
  --serif:'Spectral',Georgia,'Times New Roman',serif; --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f141b; --sheet:#171e28; --ink:#e6ebf2; --muted:#8b98ab; --rule:#263040; --soft:#1e2733;
    --navy:#dfe7f5; --navy-ink:#0f141b; --danger:#ff8a80;
    --sup:#5cc9a0; --chal:#ff8a72; --read:#f2b632; --ctx:#7fb0ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f141b; --sheet:#171e28; --ink:#e6ebf2; --muted:#8b98ab; --rule:#263040; --soft:#1e2733;
  --navy:#dfe7f5; --navy-ink:#0f141b; --danger:#ff8a80;
  --sup:#5cc9a0; --chal:#ff8a72; --read:#f2b632; --ctx:#7fb0ff; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#main{max-width:680px;margin:0 auto;padding:0 18px 130px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding:16px 0 12px;display:flex;align-items:flex-end;gap:10px}
.top .ttl{flex:1;min-width:0}
.top h1{font-family:var(--serif);font-size:2.1rem;line-height:1.05;margin:0;font-weight:600;letter-spacing:-.015em}
.top .sub{font-size:.84rem;color:var(--muted);margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.ibtn svg{width:20px;height:20px}
.hint{color:var(--muted);font-size:.84rem;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.primary{background:var(--navy);color:var(--navy-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:500;font-size:.92rem}
.ghost{background:none;border:1px solid var(--rule);border-radius:12px;padding:9px 14px;font-size:.9rem}
.small{padding:6px 12px;font-size:.82rem;border-radius:10px}
.danger{color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:32px 12px;font-size:.95rem;line-height:1.5}

/* the writing surface */
.dump{background:var(--sheet);border-radius:16px;padding:14px 16px 12px;margin:2px 0 16px;box-shadow:0 1px 0 var(--rule),0 12px 30px -16px rgba(22,33,46,.25)}
.dump textarea{width:100%;border:0;background:none;resize:none;outline:none;color:var(--ink);font-family:var(--serif);font-size:1.18rem;line-height:1.7;min-height:96px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.7em - 1px),var(--rule) calc(1.7em - 1px),var(--rule) 1.7em);background-attachment:local}
.dump textarea::placeholder{color:var(--muted);font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:500;border:1px solid var(--rule);background:none;color:var(--ink)}
.chip.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{white-space:nowrap;padding:6px 12px;font-size:.84rem}

/* feed */
.day{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:22px 0 10px;letter-spacing:-.01em}
.day small{font-family:var(--sans);font-size:.8rem;font-weight:400;color:var(--muted);margin-left:8px}
.page{position:relative;background:var(--sheet);border-radius:6px;padding:16px 18px 14px;margin:0 8px 14px 0;box-shadow:0 1px 0 var(--rule),0 10px 24px -18px rgba(22,33,46,.35);cursor:pointer}
.page.claim{border-left:4px solid var(--navy)}
.page h3{font-family:var(--serif);font-size:1.28rem;line-height:1.25;margin:0 0 6px;font-weight:600;letter-spacing:-.005em}
.page p{font-family:var(--serif);font-size:1.03rem;line-height:1.6;margin:0;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.page .meta{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.page .foot{margin-top:10px}
.etabs{position:absolute;right:-8px;top:14px;display:flex;flex-direction:column;gap:4px}
.etab{width:9px;height:22px;border-radius:0 4px 4px 0;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.etab.supports{background:var(--sup)} .etab.challenges{background:var(--chal)} .etab.readmore{background:var(--read)} .etab.context{background:var(--ctx)}
.scrap{background:var(--soft);border-radius:14px 14px 14px 3px;padding:10px 14px;margin:0 0 12px;cursor:pointer;max-width:92%}
.scrap p{font-family:var(--serif);font-size:.98rem;line-height:1.55;margin:0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scrap .meta{font-size:.74rem;color:var(--muted);margin-bottom:3px}
.pill{font-size:.72rem;font-weight:500;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted)}
.pill.claimp{background:var(--navy);color:var(--navy-ink)}
.pill.gap{background:transparent;color:var(--chal);border:1px solid var(--chal)}

/* scrapbook */
.masonry{columns:2;column-gap:12px}
.clip{break-inside:avoid;margin:0 0 12px;position:relative;cursor:pointer;background:var(--sheet);box-shadow:0 1px 0 var(--rule),0 8px 20px -16px rgba(22,33,46,.35);overflow:hidden}
.clip.loose{outline:1.5px dashed var(--rule);outline-offset:-1.5px;box-shadow:none;background:transparent}
.clip .in{padding:12px 13px 11px}
.clip .src{font-size:.74rem;color:var(--muted);margin-top:8px;line-height:1.35;word-break:break-word}
.clip.quote{border-radius:4px 14px 4px 14px}
.clip.quote .txt{font-family:var(--serif);font-size:1.02rem;line-height:1.5;font-style:italic}
.clip.quote .in::before{content:"\201C";display:block;font-family:var(--serif);font-size:2.4rem;line-height:.6;color:var(--sun);margin-bottom:2px}
.clip.data{border-radius:14px}
.clip.data .big{font-family:var(--serif);font-size:2.3rem;line-height:1;font-weight:600;letter-spacing:-.02em}
.clip.data .lab{font-size:.84rem;margin-top:6px;line-height:1.35}
.clip.link{border-radius:10px;border-top:3px solid var(--ctx)}
.clip.link .dom{font-size:.74rem;color:var(--ctx);font-weight:500;margin-bottom:3px;word-break:break-all}
.clip.link .txt{font-family:var(--serif);font-size:1rem;line-height:1.4;font-weight:500}
.clip.note{border-radius:3px 12px 12px 12px;background:#fbf0c9;color:#3b3208}
.clip.note .txt{font-family:var(--serif);font-size:.98rem;line-height:1.5;white-space:pre-wrap}
.clip.image{border-radius:3px;padding:7px 7px 2px;background:#fff}
.clip.image img{width:100%;display:block;border-radius:1px}
.clip.image .src{color:#59626d;padding:0 4px 6px}
.clip .toread{position:absolute;top:0;right:12px;width:12px;height:18px;background:var(--read);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.clip .uses{display:flex;gap:3px;margin-top:8px}
.clip .uses b{width:14px;height:5px;border-radius:3px}
.clip .uses .supports{background:var(--sup)} .clip .uses .challenges{background:var(--chal)} .clip .uses .readmore{background:var(--read)} .clip .uses .context{background:var(--ctx)}

/* topics */
.topic{display:block;width:100%;text-align:left;background:var(--sheet);border:0;border-radius:6px;padding:14px 16px 14px 20px;margin:0 0 12px;position:relative;box-shadow:0 1px 0 var(--rule),0 10px 24px -18px rgba(22,33,46,.35)}
.topic::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:6px 0 0 6px;background:var(--tc)}
.topic h3{font-family:var(--serif);font-size:1.3rem;margin:0 0 4px;font-weight:600}
.topic .stats{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.stat b{color:var(--ink);font-weight:600}
.gapcard{background:var(--sheet);border-radius:6px;padding:12px 16px;margin:0 0 12px;box-shadow:0 1px 0 var(--rule)}
.gapcard h4{margin:0 0 6px;font-family:var(--serif);font-size:1.08rem;font-weight:600}
.gapcard .it{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:9px 0;font-size:.92rem;line-height:1.4}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;margin:0 0 14px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:7px 4px;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.map{background:var(--sheet);border-radius:8px;box-shadow:0 1px 0 var(--rule);padding:4px;margin-bottom:10px}
.map svg{width:100%;height:auto;display:block;touch-action:manipulation}
.map text{font-family:var(--sans);font-size:9px;fill:var(--muted);pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin:6px 2px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid}

/* sheets and editor */
.bg{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:680px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
.sheet.full{height:94vh;height:94dvh}
@keyframes rise{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 10px}
.t-in{width:100%;border:0;background:none;font-family:var(--serif);font-size:1.75rem;line-height:1.2;font-weight:600;color:var(--ink);outline:none;padding:6px 0;letter-spacing:-.01em}
.b-in{width:100%;border:0;background:none;resize:none;font-family:var(--serif);font-size:1.14rem;line-height:1.7;color:var(--ink);outline:none;min-height:150px;padding:4px 0 12px}
.t-in:focus-visible,.b-in:focus-visible,.dump textarea:focus-visible{outline:none}
.t-in{resize:none;overflow:hidden;display:block}
.t-in::placeholder,.b-in::placeholder{color:var(--muted);font-style:italic;font-weight:400}
.sec{margin:18px 0 6px;font-family:var(--serif);font-size:1.1rem;font-weight:600}
.mark{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);border-radius:8px;padding:10px 12px;margin:0 0 8px;box-shadow:0 1px 0 var(--rule)}
.mark .role{border:1.5px solid currentColor;background:none;border-radius:8px;padding:3px 8px;font-size:.75rem;font-weight:600;flex:none;margin-top:1px}
.mark .mb{flex:1;min-width:0;cursor:pointer}
.mark .mt{font-family:var(--serif);font-size:.98rem;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mark small{color:var(--muted);font-size:.76rem}
.mark .x{background:none;border:0;font-size:1.3rem;color:var(--muted);padding:0 4px;line-height:1}
.field{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem;color:var(--ink);margin:0 0 8px}
textarea.field{font-family:var(--serif);font-size:1.02rem;line-height:1.5;min-height:90px;resize:vertical}
.lbl{font-size:.8rem;color:var(--muted);margin:10px 0 4px;display:block}
.pickrow{display:block;width:100%;text-align:left;background:var(--sheet);border:0;border-radius:8px;padding:10px 12px;margin:0 0 6px;box-shadow:0 1px 0 var(--rule)}
.pickrow .pt{font-family:var(--serif);font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pickrow small{color:var(--muted);font-size:.75rem}
.search{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:11px 14px;font:inherit;font-size:1rem;color:var(--ink);margin:0 0 12px}

/* v2: confidence, strength, history, questions, bridges, build */
.strength{background:var(--sheet);border-radius:8px;padding:10px 12px;margin:8px 0;box-shadow:0 1px 0 var(--rule)}
.strength .lab{font-size:.9rem;font-weight:600;margin-bottom:6px}
.strength .rowb{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted);margin:3px 0}
.strength .rowb em{font-style:normal;width:66px;flex:none}
.strength .track{flex:1;height:7px;border-radius:4px;background:var(--soft);overflow:hidden}
.strength .track i{display:block;height:100%;border-radius:4px}
.strength .s{background:var(--sup)} .strength .c{background:var(--chal)}
.strength .note{font-size:.76rem;color:var(--muted);margin-top:6px;line-height:1.4}
.qual{display:inline-block;font-size:.68rem;font-weight:600;border-radius:5px;padding:1px 6px;margin-top:8px;background:var(--soft);color:var(--muted)}
.clip.image .qual{background:#eef0f3;color:#59626d;margin:0 4px 6px}
.clip.note .qual{background:rgba(0,0,0,.08);color:#3b3208}
.qcard{background:var(--sheet);border-radius:6px;padding:12px 16px;margin:0 0 10px;box-shadow:0 1px 0 var(--rule);cursor:pointer;border-left:4px solid var(--ctx)}
.qcard.answered{border-left-color:var(--sup)} .qcard.parked{border-left-color:var(--muted)}
.qcard .qt{font-family:var(--serif);font-size:1.12rem;line-height:1.35;font-weight:500;margin:0 0 8px}
.tl{border-left:2px solid var(--rule);margin:10px 0 10px 8px;padding-left:16px}
.tl .ev{position:relative;margin:0 0 14px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.tl .ev.conf::before{background:var(--sun)} .tl .ev.mark::before{background:var(--sup)} .tl .ev.claim::before{background:var(--navy)} .tl .ev.text::before{background:var(--ctx)}
.tl .ev small{display:block;color:var(--muted);font-size:.74rem}
.tl .ev p{margin:2px 0 0;font-size:.92rem;line-height:1.4}
.ver{background:var(--sheet);border-radius:8px;padding:10px 12px;margin:0 0 8px;box-shadow:0 1px 0 var(--rule)}
.ver .vt{font-family:var(--serif);font-size:.98rem;line-height:1.5;white-space:pre-wrap;margin:8px 0}
.outline{background:var(--sheet);border-radius:8px;padding:14px 16px;font-family:var(--serif);font-size:.98rem;line-height:1.55;white-space:pre-wrap;box-shadow:0 1px 0 var(--rule);margin:10px 0;-webkit-user-select:text;user-select:text}
.brow{display:flex;gap:8px;align-items:center;background:var(--sheet);border-radius:8px;padding:8px 10px;margin:0 0 6px;box-shadow:0 1px 0 var(--rule)}
.brow .bt{flex:1;min-width:0;font-family:var(--serif);font-size:.98rem;line-height:1.3}
.brow button.sq{width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);background:none;font-size:1rem;flex:none}
.brow button.sq:disabled{opacity:.3}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:none;flex:none;font-size:.8rem;line-height:1;color:var(--navy-ink)}
.chk.on{background:var(--navy);border-color:var(--navy)}
.bridge{background:var(--sheet);border-radius:6px;padding:10px 14px;margin:0 0 8px;box-shadow:0 1px 0 var(--rule);border-left:4px solid var(--sun);cursor:pointer}
.bridge .bt{font-family:var(--serif);font-size:1rem;line-height:1.35;margin-bottom:6px}
.bridge small{color:var(--muted);font-size:.78rem}

/* v3: trees, sorting, clusters, start sheet */
.tnode{position:relative;margin:0 0 10px}
.tchildren{margin:8px 0 0 5px;padding-left:15px}
.tchildren>.tnode::before{content:"";position:absolute;left:-15px;top:21px;width:13px;border-top:2px solid var(--rc,var(--rule))}
.tchildren>.tnode::after{content:"";position:absolute;left:-15px;top:-10px;bottom:-10px;border-left:2px solid var(--rc,var(--rule))}
.tchildren>.tnode:last-child::after{bottom:auto;height:31px}
.tchildren>.tnode.r-challenges::before{border-top-style:dashed}
.tchildren>.tnode.r-challenges::after{border-left-style:dashed}
.r-supports{--rc:var(--sup)} .r-challenges{--rc:var(--chal)} .r-context{--rc:var(--ctx)} .r-readmore{--rc:var(--read)} .r-q{--rc:var(--ctx)}
.tcard{background:var(--sheet);border-radius:8px;padding:10px 12px;box-shadow:0 1px 0 var(--rule);display:flex;gap:10px;align-items:flex-start}
.tcard .tb{flex:1;min-width:0}
.tcard .tt{font-family:var(--serif);font-size:1.02rem;line-height:1.35;font-weight:500;text-align:left;background:none;border:0;padding:0;width:100%;color:var(--ink)}
.tcard .ts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tcard .chev{width:26px;height:26px;border-radius:7px;border:1px solid var(--rule);background:none;font-size:.8rem;flex:none;color:var(--muted)}
.tcard.root{border-left:6px solid var(--tc,var(--navy));padding:12px 14px}
.tcard.root .tt{font-size:1.2rem;font-weight:600}
.tcard.claim{border-left:4px solid var(--navy)}
.tcard.gap{background:transparent;border:1.5px dashed var(--chal);box-shadow:none}
.tcard.gap .tt{color:var(--chal);font-family:var(--sans);font-size:.88rem;font-weight:500}
.tcard.leaf{padding:8px 11px}
.tcard.leaf .tt{font-size:.94rem;font-weight:400}
.tcard.leaf.quote .tt{font-style:italic}
.tcard small{color:var(--muted);font-size:.74rem;line-height:1.3}
.qdot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;border:2px solid var(--ctx);background:none}
.qdot.answered{background:var(--sup);border-color:var(--sup)} .qdot.parked{border-color:var(--muted)}
.tmini{background:none;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:.74rem;color:var(--ink)}
.cluster{background:var(--sheet);border-radius:8px;padding:12px 14px;margin:0 0 12px;box-shadow:0 1px 0 var(--rule);border-top:4px solid var(--cc,var(--sun))}
.cluster h4{font-family:var(--serif);font-size:1.15rem;margin:0 0 6px;font-weight:600}
.cluster .mem{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--rule);padding:8px 0;font-size:.92rem;line-height:1.4}
.cluster .mem .ic{width:20px;flex:none;color:var(--muted);text-align:center}
.cluster .mem button.tx{flex:1;text-align:left;background:none;border:0;padding:0;font-family:var(--serif);font-size:.98rem;line-height:1.4;color:var(--ink)}
.cluster .mem button.x{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;padding:0 4px}

.mx{overflow-x:auto;background:var(--sheet);border-radius:8px;box-shadow:0 1px 0 var(--rule);margin:0 0 10px;-webkit-overflow-scrolling:touch}
.mxt{border-collapse:separate;border-spacing:0;font-size:.82rem}
.mxt th,.mxt td{padding:0;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);vertical-align:middle}
.mxt .rh{position:sticky;left:0;z-index:2;background:var(--sheet);min-width:136px;max-width:148px;padding:8px 10px;text-align:left;font-family:var(--serif);font-size:.88rem;line-height:1.3;font-weight:500}
.mxt .rh button{background:none;border:0;padding:0;text-align:left;font:inherit;color:var(--ink)}
.mxt .rh .pill{display:inline-block;margin-top:5px}
.mxt thead th{vertical-align:bottom;background:var(--sheet)}
.mxt .ch{writing-mode:vertical-rl;transform:rotate(180deg);height:124px;width:44px;padding:8px 2px;font-size:.74rem;line-height:1.2;text-align:left;background:none;border:0;overflow:hidden;color:var(--ink)}
.mxt tfoot td{text-align:center;font-size:.72rem;color:var(--muted);padding:6px 2px}
.mxt tfoot td.hot{color:var(--navy);font-weight:700}

.mxc.context{background:rgba(59,111,182,.2);color:var(--ctx)} .mxc.readmore{background:rgba(201,141,11,.24);color:var(--read)}

<script>
(function(){

const ICON={
 journal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h4"/></svg>',

 topics:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
 study:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
 questions:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><circle cx="12" cy="17" r=".7" fill="currentColor"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>'
};
const svgIcon=n=>{const d=document.createElement('span');d.innerHTML=ICON[n];return d.firstChild};

/* ---------- data ---------- */
let S=null;


function seed(){
  const t=Date.now(),H=36e5,D=864e5;
  const mk=(o)=>Object.assign({topics:[],marks:[],links:[],claim:false,created:t,u:t,sample:true},o);
  const topics=[{id:'t_dcs',name:'Digital culture shock',color:PALETTE[0],desc:'How fast-moving devices are reshaping attention, reward and everyday culture.',created:t,u:t,sample:true}];
  const clips=[
    {id:'c_simon',kind:'quote',text:'A wealth of information creates a poverty of attention.',source:'Herbert A. Simon, 1971 (widely attributed)',url:'',topics:['t_dcs'],toread:false,created:t-2*D,u:t-2*D,sample:true},
    {id:'c_data',kind:'data',value:'XX',label:'Average daily phone pick-ups. Replace with a real figure.',source:'Sample. Add your source here.',topics:['t_dcs'],toread:false,created:t-2*D,u:t-2*D,sample:true},
    {id:'c_counter',kind:'quote',text:'Sample counter-argument: the dopamine framing may oversimplify how habits actually form.',source:'Sample. Add your source here.',topics:['t_dcs'],toread:false,created:t-D,u:t-D,sample:true},
    {id:'c_read',kind:'link',url:'https://example.com/attention-reading-list',text:'Reading list on attention and technology',note:'Start with the neuroscience papers.',topics:['t_dcs'],toread:true,created:t-D,u:t-D,sample:true},
    {id:'c_note',kind:'note',text:'Compare how fast people adopted print, the telephone and the smartphone.',topics:['t_dcs'],toread:false,created:t-3*H,u:t-3*H,sample:true}
  ];
  const entries=[
    mk({id:'e_claim',kind:'journal',claim:true,title:'Notifications may be retraining our reward systems',body:'Every buzz is a small, unpredictable reward. If the pattern holds, the brain starts to expect the signal before the content, which would explain the phantom-vibration feeling many of us report.\n\nWhat I still need: a clear measure of how often these cues occur in a normal day, and a reason to think the effect lasts after the phone is put away.',topics:['t_dcs'],marks:[{id:'m1',clip:'c_simon',role:'context'},{id:'m2',clip:'c_data',role:'supports'},{id:'m3',clip:'c_counter',role:'challenges'},{id:'m4',clip:'c_read',role:'readmore'}],links:['e_press'],created:t-26*H,u:t-26*H}),
    mk({id:'e_press',kind:'journal',title:'The printing press analogy',body:'Each wave of new media brought a panic about attention and morals. The useful question is not whether the panic is familiar, but what was different about speed this time.',topics:['t_dcs'],created:t-50*H,u:t-50*H}),
    mk({id:'e_gap',kind:'journal',claim:true,title:'The shock is about speed of change, not the devices themselves',body:'Culture seems able to absorb almost any tool given a generation. Devices arrived faster than the habits and norms around them could settle.',topics:['t_dcs'],created:t-27*H,u:t-27*H}),
    mk({id:'e_dump',kind:'dump',title:'',body:'Does anyone measure how long a society takes to stop noticing a new technology? Compare with earlier panics about print.',created:t-40*60000,u:t-40*60000})
  ];
  return{topics,clips,entries,v:1};
}

/* ---------- helpers ---------- */
const TAGROLE=r=>ROLES[r]||ROLES.context;
const topicById=id=>S.topics.find(t=>t.id===id);
const clipById=id=>S.clips.find(c=>c.id===id);
const entryById=id=>S.entries.find(e=>e.id===id);
const hex2rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function entryTitle(e){if(e.title&&e.title.trim())return e.title.trim();const l=(e.body||'').trim().split('\n')[0];return l?(l.length>70?l.slice(0,70)+'…':l):'Untitled'}
function clipText(c){return c.kind==='data'?((c.value?c.value+' ':'')+(c.label||'')).trim():(c.text||c.note||c.url||'')}
function clipPreview(c){const t=clipText(c).replace(/\s+/g,' ');return c.kind==='image'?(c.text||'Image'):(t.length>110?t.slice(0,110)+'…':t)}
function clipSource(c){return c.kind==='link'?domain(c.url)||c.source||'':(c.source||'')}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
const usedIn=cid=>S.entries.filter(e=>e.marks.some(m=>m.clip===cid));
const roleCount=(e,r)=>e.marks.filter(m=>m.role===r).length;
function dayLabel(t){const d=new Date(t),n=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const diff=Math.round((b-a)/864e5);if(diff===0)return'Today';if(diff===1)return'Yesterday';const o={weekday:'long',month:'long',day:'numeric'};if(d.getFullYear()!==n.getFullYear())o.year='numeric';return d.toLocaleDateString([],o)}
const timeLabel=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function topicChips(ids){return ids.map(topicById).filter(Boolean).map(t=>el('span',{class:'chip'},el('i',{style:'background:'+t.color}),t.name))}

/* ---------- v2 helpers ---------- */
const QUAL={primary:{label:'Primary study or data',w:1},review:{label:'Review or analysis',w:1},expert:{label:'Expert opinion',w:.6},press:{label:'Journalism',w:.4},anecdote:{label:'Anecdote or personal',w:.25},unrated:{label:'Not rated',w:.5}};
const QUAL_KEYS=Object.keys(QUAL);
const CONF=['','Doubtful','Unsure','Leaning','Likely','Confident'];
const qOf=c=>QUAL[c.quality]||QUAL.unrated;
function strength(e){
  let sup=0,chal=0;
  (e.marks||[]).forEach(m=>{const c=clipById(m.clip);if(!c)return;const w=qOf(c).w;if(m.role==='supports')sup+=w;if(m.role==='challenges')chal+=w});
  let label='';
  if(e.claim)label=sup===0?'No support':(chal>0&&chal>=sup*.6)?'Contested':sup<1?'Thin support':sup<2?'Moderate support':'Strong support';
  return{sup,chal,label};
}
const isUnsupported=e=>e.claim&&strength(e).sup===0;
const isContested=e=>e.claim&&strength(e).label==='Contested';
const isThin=e=>e.claim&&strength(e).label==='Thin support';
function logEv(e,k,t){e.log=e.log||[];e.log.push({t:Date.now(),k,txt:t});if(e.log.length>200)e.log.shift()}
const wc=s=>(s||'').trim()?(s.trim().split(/\s+/).length):0;
function diffWords(a,b){const d=wc(b)-wc(a);return d>0?'+'+d+' words':d<0?'−'+Math.abs(d)+' words':'reworded'}
const questionById=id=>S.questions.find(q=>q.id===id);
function strengthPills(e){
  const out=[];if(!e.claim)return out;
  out.push(el('span',{class:'pill claimp',text:'Claim'}));
  const s=strength(e);
  if(s.label==='No support')out.push(el('span',{class:'pill gap',text:'Needs evidence'}));
  else if(s.label==='Contested'||s.label==='Thin support')out.push(el('span',{class:'pill gap',text:s.label}));
  else out.push(el('span',{class:'pill',text:s.label}));
  if(e.conf)out.push(el('span',{class:'pill',text:CONF[e.conf]}));
  return out;
}
/* bridges: things that live in more than one topic */
const STOP=new Set('about above after again against because before being below between both could does doing down during each from further have having here itself just more most other over same should some such than that their them then there these they this those through under until very were what when where which while with would your into onto upon also been whose whom which'.split(' '));
function tokens(s){const out=new Set();(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).forEach(w=>{if(w.length<5||STOP.has(w))return;if(w.length>5&&w.endsWith('s'))w=w.slice(0,-1);out.add(w)});return out}
function topicsOfClip(c){const s=new Set(c.topics);usedIn(c.id).forEach(e=>e.topics.forEach(t=>s.add(t)));return [...s].filter(topicById)}
function topicsOfEntry(e){const s=new Set(e.topics);(e.links||[]).map(entryById).filter(Boolean).forEach(x=>x.topics.forEach(t=>s.add(t)));S.entries.filter(x=>(x.links||[]).includes(e.id)).forEach(x=>x.topics.forEach(t=>s.add(t)));return [...s].filter(topicById)}
function bridges(){
  const out=[];
  S.clips.forEach(c=>{const t=topicsOfClip(c);if(t.length>=2)out.push({kind:'clip',id:c.id,topics:t})});
  S.entries.forEach(e=>{const t=topicsOfEntry(e);if(t.length>=2)out.push({kind:'entry',id:e.id,topics:t})});
  return out;
}
function possibleBridges(){
  const items=[];
  S.clips.forEach(c=>{const t=topicsOfClip(c);if(t.length===1)items.push({kind:'clip',id:c.id,topic:t[0],tok:tokens(clipText(c)+' '+(c.mnote||'')),obj:c})});
  S.entries.forEach(e=>{const t=topicsOfEntry(e);if(t.length===1)items.push({kind:'entry',id:e.id,topic:t[0],tok:tokens(entryTitle(e)+' '+(e.body||'')),obj:e})});
  const res=[];
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
    const a=items[i],b=items[j];if(a.topic===b.topic)continue;
    const sh=[...a.tok].filter(w=>b.tok.has(w));if(sh.length>=2)res.push({a,b,shared:sh.slice(0,4),score:sh.length});
  }
  return res.sort((x,y)=>y.score-x.score).slice(0,8);
}
const itemText=(kind,id)=>{if(kind==='clip'){const c=clipById(id);return c?clipPreview(c):''}const e=entryById(id);return e?entryTitle(e):''};
const openItem=(kind,id)=>kind==='clip'?openClipView(id):openEntry(id);
function bridgeRow(b){

/* ---------- local database (IndexedDB) ---------- */

/* ---------- saving: every change is stamped, stored here, and queued for Drive ---------- */
const ARR={e:'entries',c:'clips',t:'topics',q:'questions',s:'studies'},CK=Object.keys(ARR);
let FP={},IDS={},saveTimer=null;
const emptyState=()=>({topics:[],clips:[],entries:[],questions:[],studies:[],tomb:{},v:2,v2:true});
const fpOf=it=>{const c=Object.assign({},it);delete c.u;return JSON.stringify(c)};
function stampChanges(){
  const now=Date.now();S.tomb=S.tomb||{};
  CK.forEach(k=>{
    const cur=new Set();
    S[ARR[k]].forEach(it=>{cur.add(it.id);const f=fpOf(it);if(FP[it.id]!==f){it.u=now;FP[it.id]=f}delete S.tomb[it.id]});
    (IDS[k]||new Set()).forEach(id=>{if(!cur.has(id)){S.tomb[id]={k,t:now};delete FP[id]}});
    IDS[k]=cur;
  });
  const cut=now-90*864e5;Object.keys(S.tomb).forEach(id=>{if(S.tomb[id].t<cut)delete S.tomb[id]});
}
function persist(){if(!S)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,350)}
async function flush(){
  clearTimeout(saveTimer);saveTimer=null;if(!S)return;
  stampChanges();
  try{await idbPut('state','main',S)}catch(e){logErr('save',e);toast('Could not save on this device: '+briefErr(e))}
  syncSoon(2500,false);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(sync.on)syncSoon(600,true)});

async function gfetch(url,opts,again){

  if(!DRIVE.tok||Date.now()>DRIVE.exp){DRIVE.tok=null;sync.needAuth=true;paintSyncUI();throw gerr('auth','Signed out')}
  const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:'Bearer '+DRIVE.tok})}));
  if(r.status===401){DRIVE.tok=null;sync.needAuth=true;paintSyncUI();throw gerr('auth','Signed out')}
  if((r.status===429||r.status>=500)&&!again){await nap(900+Math.random()*900);return gfetch(url,opts,true)}
  if(!r.ok){let reason='';try{const j=await r.clone().json();reason=(((j.error||{}).errors||[{}])[0]||{}).reason||''}catch(e){}
    throw gerr(r.status===403&&/quota/i.test(reason)?'quota_exceeded':(r.status===403||r.status===429)?'rate_limited':'drive_'+r.status,'Drive '+r.status+(reason?' '+reason:''))}
  return r;
}
async function listAll(){

  do{const u=GAPI+'/files?spaces=appDataFolder&pageSize=1000&fields='+encodeURIComponent('nextPageToken,files(id,name,modifiedTime,size)')+(tok?'&pageToken='+encodeURIComponent(tok):'');
    const j=await (await gfetch(u)).json();out.push(...(j.files||[]));tok=j.nextPageToken||''}while(tok);
  return out;
}
async function driveMeta(name){
  const q=encodeURIComponent(`name='${name}' and trashed=false`);
  const j=await (await gfetch(GAPI+'/files?spaces=appDataFolder&orderBy=modifiedTime%20desc&pageSize=1&fields='+encodeURIComponent('files(id,modifiedTime)')+'&q='+q)).json();
  const f=(j.files||[])[0];if(f)DRIVE.idx[name]=f.id;return f||null;
}
function multipart(meta,blob){

  return{boundary,blob:new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${boundary}--`])};
}
async function writeItem(name,obj){
  const cache=await cloudCache();
  const id=DRIVE.idx[name]||(cache[name]&&cache[name].id)||((await driveMeta(name))||{}).id;
  const b=multipart(id?{}:{name,parents:['appDataFolder']},new Blob([JSON.stringify(obj)],{type:'application/json'}));
  const url=(id?`${GUP}/files/${id}`:`${GUP}/files`)+'?uploadType=multipart&fields=id,modifiedTime';
  let r;
  try{r=await gfetch(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b.boundary},body:b.blob})}
  catch(e){if(id&&e&&e.code==='drive_404'){delete DRIVE.idx[name];delete cache[name];return writeItem(name,obj)}throw e}
  const j=await r.json();DRIVE.idx[name]=j.id;
  cache[name]={id:j.id,mt:j.modifiedTime,content:cl(obj)};await idbPut('cloud',name,cache[name]).catch(()=>{});
}
const NAMERE=/^cp-([ectqs])-(.+)$/;
async function pushPass(){
  const cache=await cloudCache();let n=0;
  for(const k of CK)for(const it of S[ARR[k]]){
    const name='cp-'+k+'-'+it.id,c=cache[name];
    if(!c||c.content.deleted||(it.u||0)>(c.content.u||0)){await writeItem(name,it);n++}
  }
  for(const id of Object.keys(S.tomb||{})){
    const t=S.tomb[id],name='cp-'+t.k+'-'+id,c=cache[name];
    if(!c||!c.content.deleted||(c.content.u||0)<t.t){await writeItem(name,{deleted:true,id,k:t.k,u:t.t});n++}
  }

}
async function fullPass(){
  const cache=await cloudCache(),files=await listAll(),best={},dups=[];
  files.filter(f=>NAMERE.test(f.name)).sort((a,b)=>a.modifiedTime<b.modifiedTime?1:-1).forEach(f=>{if(best[f.name])dups.push(f);else best[f.name]=f});
  dups.forEach(f=>gfetch(GAPI+'/files/'+f.id,{method:'DELETE'}).catch(()=>{}));
  DRIVE.idx={};Object.keys(best).forEach(n=>DRIVE.idx[n]=best[n].id);
  for(const n of Object.keys(cache)){if(NAMERE.test(n)&&!best[n]){delete cache[n];idbDel('cloud',n).catch(()=>{})}}
  const need=Object.keys(best).filter(n=>!cache[n]||cache[n].mt!==best[n].modifiedTime||cache[n].id!==best[n].id);
  await pool(need,6,async n=>{
    try{const content=await (await gfetch(GAPI+'/files/'+best[n].id+'?alt=media')).json();cache[n]={id:best[n].id,mt:best[n].modifiedTime,content};await idbPut('cloud',n,cache[n]).catch(()=>{})}
    catch(e){if(e&&e.code==='auth')throw e;delete cache[n];logErr('read '+n,e)}
  });
  stampChanges();let changed=false;S.tomb=S.tomb||{};
  for(const name of Object.keys(best)){
    const c=cache[name];if(!c)continue;const m=NAMERE.exec(name),k=m[1],id=m[2],rem=c.content,arr=S[ARR[k]],loc=arr.find(x=>x.id===id);
    if(rem.deleted){
      if(loc&&(loc.u||0)<=(rem.u||0)){arr.splice(arr.indexOf(loc),1);IDS[k].delete(id);delete FP[id];S.tomb[id]={k,t:rem.u||Date.now()};changed=true}
      else if(!loc&&!S.tomb[id]){S.tomb[id]={k,t:rem.u||Date.now()}}
    }else if(!loc){
      if(!(S.tomb[id]&&S.tomb[id].t>=(rem.u||0))){arr.push(cl(rem));IDS[k].add(id);FP[id]=fpOf(rem);delete S.tomb[id];changed=true}
    }else if((rem.u||0)>(loc.u||0)){
      Object.keys(loc).forEach(x=>delete loc[x]);Object.assign(loc,cl(rem));FP[id]=fpOf(loc);changed=true;
    }
  }
  await pushPass();
  try{const q=((await (await gfetch(`${GAPI}/about?fields=storageQuota`)).json()).storageQuota)||{};sync.usage={bytes:+(q.usage||0),maxBytes:+(q.limit||0)}}catch(e){}
  return changed;
}
function syncSoon(ms,full){

  sync.timer=setTimeout(()=>{const f=sync.wantFull;sync.wantFull=false;runSync(f)},ms);
}
async function runSync(full){

  sync.running=true;setSync('syncing','Syncing…');
  let changed=false,failed=false;
  try{
    stampChanges();
    if(full)changed=await fullPass();else await pushPass();
    if(changed)await idbPut('state','main',S);
    sync.last=Date.now();
    setSync('ok','Synced '+new Date(sync.last).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(sync.usage?' · Google Drive '+fmtSize(sync.usage.bytes)+(sync.usage.maxBytes?' of '+fmtSize(sync.usage.maxBytes):'')+' used':''));
  }catch(e){

    setSync('error',c==='auth'?'Google sign-in expired. Tap Reconnect.':c==='quota_exceeded'?'Your Google Drive is full. Free up space and tap Sync now.':c==='rate_limited'?'Sync paused (too many requests). Retrying shortly.':'Could not sync ('+briefErr(e)+'). Retrying shortly.');
    if(c!=='auth')syncSoon(120000,true);
  }finally{sync.running=false}
  if(!failed&&changed){if(document.querySelector('.bg'))sync.pendingRender=true;else render()}
  if(sync.again){const f=sync.againFull;sync.again=false;sync.againFull=false;syncSoon(300,f)}
}

function mergeIncoming(j){
  const st=(j&&j.state)||j;
  if(!st||!Array.isArray(st.entries)||!Array.isArray(st.clips))throw new Error('This is not a Commonplace backup.');
  let added=0,updated=0;S.tomb=S.tomb||{};
  ['topics','clips','entries','questions'].forEach(a=>{
    (st[a]||[]).forEach(it=>{
      if(!it||!it.id)return;const loc=S[a].find(x=>x.id===it.id);
      if(!loc){S[a].push(it);added++}else if((it.u||0)>(loc.u||0)){Object.keys(loc).forEach(x=>delete loc[x]);Object.assign(loc,it);updated++}
    });

  const data=j.data||{},docs=data.docs||[],out=[];
  (data.annos||[]).filter(a=>!a.del&&a.type!=='ink').forEach(a=>{
    const d=docs.find(x=>x.id===a.doc);if(!d)return;
    let quote=a.text!=null?a.text:(d.text?d.text.slice(a.start,a.end):'');
    quote=(quote||'').replace(/\s+/g,' ').trim();if(!quote)return;
    let loc='';if(a.page)loc='p. '+a.page;else if(a.ch!=null)loc=(d.toc&&d.toc[a.ch])||('Section '+(a.ch+1));

  });

}

/* ---------- clusters: scattered things grouped by what they share ---------- */
function clusterPool(scope){
  const items=[];
  const addE=e=>items.push({kind:'entry',id:e.id,text:entryTitle(e)+' '+(e.body||''),label:entryTitle(e),topics:e.topics});
  const addQ=q=>items.push({kind:'question',id:q.id,text:q.text+' '+(q.answer||''),label:q.text,topics:q.topics});
  const addC=c=>items.push({kind:'clip',id:c.id,text:clipText(c)+' '+(c.mnote||'')+' '+(c.source||''),label:clipPreview(c),topics:topicsOfClip(c)});
  if(scope==='pile'){pileItems().forEach(it=>{const o=pileObj(it);if(!o)return;it.kind==='entry'?addE(o):it.kind==='question'?addQ(o):addC(o)})}
  else if(scope==='all'){S.entries.forEach(addE);S.questions.forEach(addQ);S.clips.forEach(addC)}
  else{S.entries.filter(e=>e.topics.includes(scope)).forEach(addE);S.questions.filter(q=>q.topics.includes(scope)).forEach(addQ);S.clips.filter(c=>c.topics.includes(scope)).forEach(addC)}
  return items;
}
function makeClusters(items,excluded){
  const N=items.length,toks=items.map(it=>tokens(it.text));
  const df=new Map();toks.forEach(s=>s.forEach(w=>df.set(w,(df.get(w)||0)+1)));
  const maxdf=Math.max(2,Math.floor(N*.6));
  const un=new Set();items.forEach((it,i)=>{if(!excluded.has(it.kind+':'+it.id))un.add(i)});
  const clusters=[];
  for(;;){
    const cnt=new Map();un.forEach(i=>toks[i].forEach(w=>{const d=df.get(w);if(d>=2&&d<=maxdf)cnt.set(w,(cnt.get(w)||0)+1)}));
    let best=null,bs=0;cnt.forEach((c,w)=>{if(c>=2){const s=c*Math.log(1+N/df.get(w));if(s>bs){bs=s;best=w}}});
    if(!best)break;
    const mem=[...un].filter(i=>toks[i].has(best));
    const second=new Map();mem.forEach(i=>toks[i].forEach(w=>{if(w!==best)second.set(w,(second.get(w)||0)+1)}));
    const terms=[best];[...second.entries()].sort((a,b)=>b[1]-a[1]).forEach(([w,c])=>{if(terms.length<3&&c>=2&&c>=mem.length*.6)terms.push(w)});
    mem.forEach(i=>un.delete(i));clusters.push({terms,members:mem});
  }
  clusters.sort((a,b)=>b.members.length-a.members.length);
  return{clusters,rest:[...un]};
}
const CTYPE={entry:'▤',question:'?',clip:'❝'};

function addSamples2(S){

  if(!has('t_att'))S.topics.push({id:'t_att',name:'Attention economy',color:PALETTE[5],desc:'Attention as a scarce resource that platforms compete to capture.',created:t,u:t,sample:true});

  if(!has('c_notif'))S.clips.push({id:'c_notif',kind:'quote',text:'Sample: notification design borrows reward schedules from slot machines.',source:'Sample. Add your source here.',url:'',topics:['t_att'],toread:false,quality:'press',created:t-D,u:t-D,sample:true});
  if(!has('e_att'))S.entries.push({id:'e_att',kind:'journal',claim:true,conf:4,title:'Platforms compete for attention, so product design follows',body:'If attention is the scarce input, features that capture it will survive, whatever they do to the people using them.',topics:['t_att'],marks:[{id:'m9',clip:'c_simon',role:'supports'},{id:'m10',clip:'c_notif',role:'supports'}],links:[],hist:[],log:[{t:t-6*D,k:'new',txt:'Started this entry'},{t:t-6*D,k:'claim',txt:'Marked as a claim'},{t:t-2*D,k:'mark',txt:'Earmarked as supports: A wealth of information creates a poverty of attention.'}],created:t-6*D,u:t-2*D,sample:true});
  const c=S.entries.find(x=>x.id==='e_claim');
  if(c&&c.sample&&!(c.log&&c.log.length)){
    c.conf=3;c.hist=[{t:t-9*D,title:'Notifications might retrain reward systems',body:'Every buzz seems like a small reward. Maybe the brain expects the signal before the content.'}];
    c.log=[{t:t-9*D,k:'new',txt:'Started this entry'},{t:t-8*D,k:'claim',txt:'Marked as a claim'},{t:t-8*D,k:'conf',txt:'Confidence set to Unsure'},{t:t-7*D,k:'mark',txt:'Earmarked as supports: Average daily phone pick-ups. Replace with a real figure.'},{t:t-4*D,k:'text',txt:'Edited the text (+31 words)'},{t:t-3*D,k:'mark',txt:'Earmarked as challenges: Sample counter-argument about the dopamine framing.'},{t:t-3*D,k:'conf',txt:'Confidence Unsure → Leaning'}];
  }
  [{id:'q_persist',text:'Does the effect persist after the phone is put away?',status:'open',topics:['t_dcs'],refs:['e_claim']},
   {id:'q_fade',text:'How fast did earlier media panics fade?',status:'open',topics:['t_dcs'],refs:['e_press']},
   {id:'q_dop',text:'Is “dopamine” even the right frame for this?',status:'parked',topics:['t_dcs','t_att'],refs:[]}
  ].forEach(o=>{if(!has(o.id))S.questions.push(Object.assign({answer:'',created:t-2*D,u:t-2*D,sample:true},o))});
}
function upgrade(s){
  s.questions=s.questions||[];s.studies=s.studies||[];
  if(!s.v2){s.v2=true;if(s.entries.some(e=>e.sample)||s.clips.some(c=>c.sample))addSamples2(s)}
  if(!s.v3){s.v3=true;if(s.entries.some(e=>e.sample)||s.clips.some(c=>c.sample))addSamples3(s)}
  if(!s.v4){s.v4=true;if(s.entries.some(e=>e.sample)||s.clips.some(c=>c.sample))addSamples4(s)}
  s.entries.forEach(e=>{e.hist=e.hist||[];e.log=e.log||[];if(e.conf==null)e.conf=0;e.links=e.links||[];e.marks=e.marks||[];e.topics=e.topics||[]});
  s.clips.forEach(c=>{if(!c.quality)c.quality='unrated';c.topics=c.topics||[]});
  return s;
}
